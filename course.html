<html lang="zh-Hant">
<head>

<div class="course-page">
  <div class="breadcrumb" id="breadcrumb"></div>
  <div id="courseWrap"></div>

  <div id="otherWrap" style="margin-top:5rem;display:none;">
    <p class="sec-eyebrow">More Workshops</p>
    <h2 class="sec-title" style="font-size:1.6rem;">其他課程</h2>
    <div class="course-grid" id="otherGrid" style="margin-top:2.5rem;"></div>
  </div>
</div>

<footer>
  <div class="footer-brand"><img class="footer-logo" src="/FLOWERCHAN_WHITE.png" alt="Flower Chan">FLOWER CHAN<small>小花店 · 讓每個時刻都有花的陪伴</small></div>
  <div class="footer-links">
    <a href="https://www.instagram.com/flowerchan_tw/" target="_blank">Instagram</a>
    <a href="https://www.facebook.com/freshasdaisyflower" target="_blank">Facebook</a>
    <a href="https://lin.ee/jZUeNhm" target="_blank">LINE</a>
    <a href="tel:0223637539">02-2363-7539</a>
  </div>
  <p>© 2026 Flower Chan 小花店（小花序章企業社）· 台北市辛亥路二段43號1樓</p>
</footer>

<script src="/assets/site.js"></script>
<script>
function coursePhotoList(c) {
  const urls = [];
  if (Array.isArray(c.photos) && c.photos.length) {
    c.photos.forEach(ph => {
      if (ph.cloudinary_id) urls.push(`https://res.cloudinary.com/${CLOUDINARY_CLOUD}/image/upload/w_900,q_auto,f_auto/${ph.cloudinary_id}`);
      else if (typeof ph === 'string') urls.push(ph);
    });
  } else if (c.cloudinary_id) {
    urls.push(`https://res.cloudinary.com/${CLOUDINARY_CLOUD}/image/upload/w_900,q_auto,f_auto/${c.cloudinary_id}`);
  } else if (c.photo) {
    urls.push(c.photo);
  }
  return urls.slice(0, 10); // 課程內頁最多 10 張
}

function render(c, all) {
  document.title = `${c.name}｜Flower Chan 小花店`;
  document.getElementById('breadcrumb').innerHTML =
    `<a href="/">首頁</a><span>/</span><a href="/courses">花藝課程</a><span>/</span>${c.name}`;

  const photos = coursePhotoList(c);
  const statusMap = { '報名中': 'open', '額滿': 'full', '已結束': 'closed' };
  const cls = statusMap[c.status] || 'open';
  const closed = c.status === '額滿' || c.status === '已結束';

  document.getElementById('courseWrap').innerHTML = `
  <div class="course-hero-grid">
    <div class="product-photos">
      ${photos.length
        ? `<img class="product-photo-main" id="mainPhoto" src="${photos[0]}" alt="${c.name}" style="aspect-ratio:4/3;">`
        : '<div class="course-photo-placeholder" style="aspect-ratio:4/3;border-radius:var(--radius);font-size:3rem;">🌿</div>'}
      ${photos.length > 1 ? `
      <div class="product-thumbs">
        ${photos.map((u, i) => `<img src="${u}" class="${i === 0 ? 'active' : ''}" onclick="swapPhoto(this,'${u}')" alt="${c.name} ${i + 1}">`).join('')}
      </div>` : ''}
    </div>
    <div class="product-info">
      <p class="course-type">${c.type || '常態課程'}${c.date ? ' ｜ ' + c.date : ''}</p>
      <h1 class="product-title">${c.name}</h1>
      ${c.name_en ? `<p style="font-family:'Cormorant Garamond',serif;font-style:italic;color:var(--muted);margin-bottom:0.8rem;">${c.name_en}</p>` : ''}
      <span class="course-status ${cls}">${c.status || '報名中'}</span>
      <p class="product-price">${c.price ? 'NT$ ' + Number(c.price).toLocaleString() : '價格洽詢'}</p>
      <p class="product-price-note">費用含全部花材與工具，作品可帶回</p>

      <div class="spec-block">
        <p class="spec-label">課程資訊</p>
        <p class="spec-val">
          ${c.duration ? '時長｜' + c.duration + '<br>' : ''}
          ${c.capacity ? '名額｜' + c.capacity + '<br>' : ''}
          ${c.date ? '開課｜' + c.date + '<br>' : '時間｜彈性預約，LINE 與我們約時間'}
        </p>
      </div>

      ${c.description ? `<p class="product-desc">${c.description}</p>` : ''}

      <div class="product-cta">
        ${closed
          ? '<span class="btn-dark" style="opacity:0.45;pointer-events:none;">本期已截止</span>'
          : `<a class="line-btn" href="${LINE_URL}" target="_blank">LINE 詢問報名</a>`}
      </div>

      <div class="accordion" style="margin-top:1rem;">
        <div class="accordion-item">
          <button class="accordion-head" onclick="this.parentElement.classList.toggle('open')">報名方式</button>
          <div class="accordion-body">
            1. 點「LINE 詢問報名」，告訴我們想上的課程與偏好時間。<br>
            2. 確認時段與名額後，完成付款即報名成功。<br>
            3. 上課地點：台北市辛亥路二段43號1樓。
          </div>
        </div>
        <div class="accordion-item">
          <button class="accordion-head" onclick="this.parentElement.classList.toggle('open')">改期與取消</button>
          <div class="accordion-body">
            如需改期，請於課前 3 天告知，可免費改期一次。<br>
            課程材料為預先備貨，恕不接受課前 3 天內取消退費。
          </div>
        </div>
      </div>
    </div>
  </div>`;

  const others = all.filter(x => x.code !== c.code).slice(0, 4);
  if (others.length) {
    document.getElementById('otherWrap').style.display = 'block';
    document.getElementById('otherGrid').innerHTML = others.map(courseCardHtml).join('');
  }
  observeReveal();
}

function swapPhoto(el, url) {
  document.getElementById('mainPhoto').src = url;
  document.querySelectorAll('.product-thumbs img').forEach(i => i.classList.remove('active'));
  el.classList.add('active');
}

async function init() {
  const code = new URLSearchParams(location.search).get('code');
  try {
    const all = await fetchCourses();
    const c = all.find(x => x.code === code);
    if (!c) {
      document.getElementById('courseWrap').innerHTML =
        '<p style="padding:4rem 0;color:var(--muted);">找不到這堂課程，<a href="/courses" style="color:var(--green)">回到課程列表</a> 看看其他課程吧。</p>';
      return;
    }
    render(c, all);
  } catch (e) {
    document.getElementById('courseWrap').innerHTML =
      '<p style="padding:4rem 0;color:var(--muted);">課程載入中，請稍候...</p>';
  }
}
init();
</script>
</body>
</html>
